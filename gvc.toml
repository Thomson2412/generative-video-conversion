# gvc configuration. Every key is optional; CLI flags override this file.
# Precedence: built-in defaults <- preset <- this file <- CLI flags.

# literal | stable-text | chain | full | full-ref | guided   (see `gvc presets`)
preset = "full"

[caption]
backend = "ollama"        # ollama | llama-server   (compare with `gvc bench`)
model = "qwen2.5vl:7b"    # Ollama model name
# llama-server: Hugging Face repo[:quant] (auto-download) or a local .gguf + llama_mmproj
llama_model = "ggml-org/Qwen2.5-VL-7B-Instruct-GGUF:Q4_K_M"
# llama_mmproj = ""
# llama_server_args = ["--image-max-tokens", "256"]
image_size = 512          # longest side sent to the LLM; 0 = original (much slower)
parallel = 4              # concurrent requests, only for caption context "none"
# context = "text"        # none | text | text+image   (set by the preset)
window = 1
max_words = 60
temperature = 0.2
seed = 42
# ollama_url = "http://127.0.0.1:11434"
# llama_url = "http://127.0.0.1:8080"
# manage_server = true

[generate]
# init = "chain"          # none | chain | chain-ref | source   (set by the preset)
strength = 0.55           # img2img strength for chain / source
ref_method = "ip-adapter" # chain-ref: ip-adapter | ref-images
ref_strength = 0.7
seed = 42
# RealVisXL V5.0 Lightning (photoreal SDXL). For SDXL-Turbo instead use:
#   model = "models/sd_xl_turbo_1.0_fp16.safetensors", steps = 4, cfg_scale = 1.0,
#   sampler = "euler_a", scheduler = "", size = 512, negative_prompt = ""
steps = 5
cfg_scale = 1.5           # > 1 makes negative_prompt work, at about twice the cost per step
sampler = "dpm++2m_sde"   # euler_a | euler | dpm++2m | dpm++2m_sde | lcm | ...
scheduler = "karras"      # karras | exponential | discrete | ... ("" = server default)
size = 768                # ~768x768 pixels in the source aspect ratio (1024x576 for 16:9)
style = ""                # e.g. "oil painting, thick brush strokes"
negative_prompt = "(cartoon, 3d render, cgi, animation, drawing, anime, octane render:1.3), (worst quality, low quality, blurry:1.2)"
model = "models/RealVisXL_V5.0_Lightning_fp16.safetensors"
vae = "models/sdxl_vae-fp16-fix.safetensors"
ip_adapter = "models/ip-adapter_sdxl_vit-h.safetensors"
clip_vision = "models/clip_vision_h.safetensors"
server_args = ["--diffusion-fa", "--vae-tiling"]   # tiling: SDXL VAE at 768+ does not fit next to the model in 10 GB
# server_url = "http://127.0.0.1:7860"
# manage_server = true

[dedupe]
max_distance = -1          # perceptual hash distance; -1 disables

[reset]
scene_threshold = 0.16    # frame difference (0..1) that counts as a scene cut
every_n = 0               # also restart both chains every N frames (0 = off)

[fade]
enabled = true            # keep black frames black and apply fades to/from black after generation
black_level = 0.03        # mean brightness (0..1) at or below which a frame counts as black
min_rise = 0.005          # min brightness rise per frame for a frame to belong to a fade ramp

[output]
keep_audio = true
codec = "libx264"
crf = 18
scale_to_source = true
